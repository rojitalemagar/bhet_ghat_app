<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f3" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #9f1239; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .layerTitle { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .item { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc" />
  <rect x="40" y="28" width="1120" height="90" rx="24" fill="url(#titleGrad)" stroke="#fda4af" />
  <text x="70" y="70" class="title">BhetGhat Clean Architecture Diagram</text>
  <text x="70" y="98" class="subtitle">The Flutter app separates presentation, domain, and data concerns to improve maintainability and testability.</text>

  <rect x="120" y="160" width="960" height="140" rx="24" fill="#ffffff" stroke="#fb7185" stroke-width="2.5" />
  <text x="150" y="198" class="layerTitle">Presentation Layer</text>
  <text x="150" y="230" class="item">Screens: Login, Register, Dashboard, Profile, Accelerometer, Gyroscope</text>
  <text x="150" y="258" class="item">Controllers: AuthController, DatingController, ThemeController, ProfileController</text>
  <text x="150" y="286" class="item">State Handling: Provider + ChangeNotifier</text>

  <rect x="120" y="340" width="960" height="120" rx="24" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" />
  <text x="150" y="378" class="layerTitle">Domain Layer</text>
  <text x="150" y="410" class="item">Entities: User</text>
  <text x="150" y="438" class="item">Use Cases: SignUpUseCase, LoginUseCase</text>
  <text x="560" y="410" class="item">Abstraction: AuthRepository</text>

  <rect x="120" y="500" width="960" height="140" rx="24" fill="#ffffff" stroke="#14b8a6" stroke-width="2.5" />
  <text x="150" y="538" class="layerTitle">Data Layer</text>
  <text x="150" y="570" class="item">Repository Implementation: AuthRepositoryImpl</text>
  <text x="150" y="598" class="item">Remote Data Source: AuthRemoteDataSource (HTTP API)</text>
  <text x="150" y="626" class="item">Local Data Source: AuthLocalDataSource (Hive)</text>

  <rect x="150" y="660" width="390" height="70" rx="18" fill="#ecfeff" stroke="#0891b2" />
  <text x="175" y="700" class="small">Local Persistence: Hive box for local authentication fallback</text>

  <rect x="660" y="660" width="390" height="70" rx="18" fill="#f0fdf4" stroke="#16a34a" />
  <text x="685" y="700" class="small">Remote Service: Node.js / Express backend with auth, profile, image upload</text>

  <line x1="600" y1="300" x2="600" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="600" y1="460" x2="600" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="400" y1="640" x2="340" y2="660" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="800" y1="640" x2="860" y2="660" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
</svg>
