<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #9f1239; }
      .body { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .note { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" />
  <text x="60" y="60" class="title">Provider and ChangeNotifier State Management</text>

  <rect x="370" y="100" width="450" height="90" rx="22" fill="#ffffff" stroke="#fb7185" stroke-width="2.5" />
  <text x="520" y="140" class="body">MultiProvider in main.dart</text>
  <text x="450" y="170" class="note">Injects shared controllers into the widget tree</text>

  <rect x="70" y="280" width="240" height="120" rx="20" fill="#ffffff" stroke="#fb7185" stroke-width="2.5" />
  <text x="122" y="322" class="body">AuthController</text>
  <text x="90" y="352" class="note">currentUser, loading, errors,</text>
  <text x="102" y="375" class="note">bio, interests, profile images</text>

  <rect x="350" y="280" width="240" height="120" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" />
  <text x="394" y="322" class="body">DatingController</text>
  <text x="394" y="352" class="note">profiles, matches, chats,</text>
  <text x="405" y="375" class="note">likes, unread counts</text>

  <rect x="630" y="280" width="240" height="120" rx="20" fill="#ffffff" stroke="#14b8a6" stroke-width="2.5" />
  <text x="682" y="322" class="body">ThemeController</text>
  <text x="682" y="352" class="note">light mode / dark mode</text>

  <rect x="910" y="280" width="240" height="120" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" />
  <text x="957" y="322" class="body">ProfileController</text>
  <text x="960" y="352" class="note">image upload loading,</text>
  <text x="968" y="375" class="note">upload errors</text>

  <rect x="40" y="500" width="320" height="120" rx="20" fill="#fff7ed" stroke="#ea580c" />
  <text x="145" y="545" class="body">UI Screens</text>
  <text x="77" y="575" class="note">Dashboard, Profile, Login, Register,</text>
  <text x="142" y="598" class="note">Splash</text>

  <rect x="430" y="500" width="340" height="120" rx="20" fill="#eff6ff" stroke="#2563eb" />
  <text x="515" y="545" class="body">notifyListeners()</text>
  <text x="490" y="578" class="note">Pushes state changes back to UI</text>

  <rect x="840" y="500" width="320" height="120" rx="20" fill="#f0fdf4" stroke="#16a34a" />
  <text x="918" y="545" class="body">Reactive Update</text>
  <text x="888" y="575" class="note">Consumer rebuilds only what is</text>
  <text x="967" y="598" class="note">needed</text>

  <line x1="595" y1="190" x2="190" y2="280" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="595" y1="190" x2="470" y2="280" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="595" y1="190" x2="750" y2="280" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="595" y1="190" x2="1030" y2="280" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />

  <line x1="190" y1="400" x2="200" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="470" y1="400" x2="600" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="750" y1="400" x2="600" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1030" y1="400" x2="1000" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />

  <line x1="360" y1="560" x2="430" y2="560" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="770" y1="560" x2="840" y2="560" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
</svg>
